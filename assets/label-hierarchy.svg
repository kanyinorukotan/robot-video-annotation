<rect x="318.2" y="180" width="78.7" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="354.6" y="200" font-size="12" fill="#222">4</text>
<rect x="398.9" y="180" width="72.9" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="432.4" y="200" font-size="12" fill="#222">5</text>
<rect x="473.8" y="180" width="61.4" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
