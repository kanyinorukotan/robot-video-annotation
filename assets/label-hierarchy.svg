<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, sans-serif" font-size="13">
<rect width="900" height="330" fill="#ffffff"/>
<text x="60" y="26" font-size="16" font-weight="bold" fill="#222">Three-level action hierarchy (one L3, 23 s at 30 fps)</text>
<text x="8" y="78" fill="#444">L3</text><rect x="60" y="60" width="800" height="30" rx="4" fill="#c9d4ff" stroke="#5a6fd6"/>
<text x="68" y="80" fill="#222">Grasp and pull apart the ziplock bag with both arms after the first grasp slips</text>
<text x="8" y="138" fill="#444">L2</text>
<rect x="60.0" y="120" width="505.2" height="30" rx="4" fill="#bfe9f2" stroke="#2e9db8"/>
<text x="66.0" y="140" font-size="12" fill="#222">Grasp and reposition the bag</text>
<rect x="567.2" y="120" width="170.9" height="30" rx="4" fill="#bfe9f2" stroke="#2e9db8"/>
<text x="573.2" y="140" font-size="12" fill="#222">Pick up the bag</text>
<rect x="740.1" y="120" width="117.9" height="30" rx="4" fill="#bfe9f2" stroke="#2e9db8"/>
<text x="746.1" y="140" font-size="12" fill="#222">Pull open the bag</text>
<text x="8" y="198" fill="#444">L1</text>
<rect x="60.0" y="180" width="87.9" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="101.0" y="200" font-size="12" fill="#222">1</text>
<rect x="149.9" y="180" width="74.1" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
