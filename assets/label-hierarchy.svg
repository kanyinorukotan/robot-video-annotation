<rect x="567.2" y="180" width="47.6" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="588.0" y="200" font-size="12" fill="#222">8</text>
<rect x="616.8" y="180" width="29.1" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="628.3" y="200" font-size="12" fill="#222">9</text>
<rect x="647.9" y="180" width="36.0" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
<text x="662.9" y="200" font-size="12" fill="#222">10</text>
<rect x="685.9" y="180" width="52.2" height="30" rx="3" fill="#e3c9f5" stroke="#8a4fb8"/>
