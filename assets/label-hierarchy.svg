<text x="60" y="250" fill="#444">Every L1 sits inside an L2 and every L2 inside the L3, with no gaps.</text>
<text x="60" y="272" fill="#444">Limits: L1 0.5-3 s · L2 3-20 s · L3 20-120 s.</text>
<text x="60" y="294" fill="#444">Numbers 1-13 are the L1 steps listed in the README table.</text>
